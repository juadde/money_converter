name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Analyze, test, build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: bash tool/bootstrap_platforms.sh
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Check the ECB to JSON script
        run: |
          python3 tool/ecb_to_json.py --input test/fixtures/eurofxref-hist-sample.xml --output /tmp/rates.json
          python3 -c "import json; d = json.load(open('/tmp/rates.json')); assert len(d['days']) == 3, d"
      - run: flutter build web --release

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: bash tool/bootstrap_platforms.sh
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: moneyconverter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
