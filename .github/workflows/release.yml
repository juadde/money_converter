name: Release

# A GitHub release for every push on main (so every merged pull request),
# with the app for Android (signed APK), Windows (zip) and Linux (tar.gz and
# snap). Tag: v<pubspec version>-<run number>, for example v2.0.0-42.

on:
  push:
    branches: [main]
  # Builds only (no release) when a pull request changes the release itself.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tool/build_android_release.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: bash tool/bootstrap_platforms.sh
      - name: Upload key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS (see README, Play Store)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
      - name: Build the signed APK
        env:
          ANDROID_ARTIFACT: apk
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          bash tool/build_android_release.sh
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/money-converter-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: dist
          retention-days: 7

  windows:
    name: Windows zip
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    env:
      # Code signing by SignPath (see CODE_SIGNING.md), once the project is
      # accepted and these are set: secret SIGNPATH_API_TOKEN, variable
      # SIGNPATH_ORGANIZATION_ID. Without them the zip is left unsigned.
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      HAS_SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: bash tool/bootstrap_platforms.sh
      - run: flutter build windows --release

      - name: Code signing enabled?
        id: signing
        run: |
          if [ -n "$SIGNPATH_ORGANIZATION_ID" ] && [ "$HAS_SIGNPATH_TOKEN" = true ] \
             && [ "${{ github.event_name }}" != pull_request ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # SignPath fetches the unsigned files from GitHub itself, which proves
      # they were built here from the public repository.
      - name: Upload the unsigned app for signing
        id: unsigned
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: build/windows/x64/runner/Release
          retention-days: 1
      - name: Sign with SignPath
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'money_converter' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Release signing is approved by hand in SignPath: leave time for it.
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed

      - name: Zip the app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $app = if ("${{ steps.signing.outputs.enabled }}" -eq "true") { "signed" } else { "build/windows/x64/runner/Release" }
          Compress-Archive -Path "$app/*" -DestinationPath dist/money-converter-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist
          retention-days: 7

  linux:
    name: Linux tar.gz and snap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: bash tool/bootstrap_platforms.sh
      - run: flutter build linux --release
      - name: Snap version
        run: |
          base=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          sed -i "s/^version: .*/version: '${base}+${{ github.run_number }}'/" snap/snapcraft.yaml
      - uses: snapcore/action-build@v1
        id: snap
      - name: Collect the files
        run: |
          mkdir -p dist
          tar -czf dist/money-converter-linux-x64.tar.gz -C build/linux/x64/release/bundle .
          cp "${{ steps.snap.outputs.snap }}" dist/money-converter-linux-amd64.snap
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist
          retention-days: 7

  release:
    name: GitHub release
    needs: [android, windows, linux]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
        run: |
          version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          tag="v${version}-${RUN}"
          title=$(git log -1 --format=%s "$GITHUB_SHA")
          {
            echo "**${title}**"
            echo ""
            echo "## What's new"
            echo ""
            cat fastlane/metadata/android/en-US/changelogs/default.txt
            echo ""
            echo "## Nouveautés"
            echo ""
            cat fastlane/metadata/android/fr-FR/changelogs/default.txt
            echo ""
            echo "## Downloads"
            echo ""
            echo "| File | Platform | How to install |"
            echo "| --- | --- | --- |"
            echo "| \`money-converter-android.apk\` | Android 5.0+ | Open the file on the phone (allow installs from this source). Signed with the developer's own key: uninstall a Google Play version first. |"
            if [ "$WINDOWS_SIGNED" = true ]; then
              echo "| \`money-converter-windows-x64.zip\` | Windows 10/11 (x64) | Unzip and run \`moneyconverter.exe\`. Signed: free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org). |"
            else
              echo "| \`money-converter-windows-x64.zip\` | Windows 10/11 (x64) | Unzip and run \`moneyconverter.exe\`. Not signed: Windows SmartScreen may ask for confirmation. |"
            fi
            echo "| \`money-converter-linux-x64.tar.gz\` | Linux (x64, GTK 3) | Extract and run \`./moneyconverter\`. |"
            echo "| \`money-converter-linux-amd64.snap\` | Linux (snapd) | \`sudo snap install --dangerous money-converter-linux-amd64.snap\` |"
            echo ""
            echo "Web version: https://juadde.github.io/money_converter/"
          } > notes.md
          gh release create "$tag" dist/* \
            --title "Money Converter ${version} (build ${RUN})" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest
          echo "Release $tag created" >> "$GITHUB_STEP_SUMMARY"
