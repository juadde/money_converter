name: Release

# A GitHub release for every push on main (so every merged pull request),
# with the app for Android (signed APK), Windows (zip) and Linux (tar.gz and
# snap). Tag: v<pubspec version>-<run number>, for example v2.0.0-42.

on:
  push:
    branches: [main]
  # Builds only (no release) when a pull request changes the release itself.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tool/build_android_release.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: bash tool/bootstrap_platforms.sh
      - name: Upload key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS (see README, Play Store)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
      - name: Build the signed APK
        env:
          ANDROID_ARTIFACT: apk
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          bash tool/build_android_release.sh
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/money-converter-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: dist
          retention-days: 7

  windows:
    name: Windows zip
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: bash tool/bootstrap_platforms.sh
      - run: flutter build windows --release
      # Flutter apps need the Visual C++ runtime, which is not installed on
      # every PC ("VCRUNTIME140_1.dll was not found"). The zip ships it next
      # to the exe (app-local copy of the redistributable files, from the
      # Visual Studio of the runner). The MSIX package already includes it.
      - name: Add the Visual C++ runtime
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory |
            Sort-Object { [version]$_.Parent.Parent.Name } | Select-Object -Last 1
          if (-not $crt) { throw "Visual C++ redistributable files not found under $vs" }
          Write-Output "Runtime from $($crt.FullName)"
          $release = 'build/windows/x64/runner/Release'
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item (Join-Path $crt.FullName $dll) $release
          }
          # Every Visual C++ runtime DLL used by the exe and the DLLs must be in the zip.
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          $missing = @()
          foreach ($bin in Get-ChildItem "$release\*" -Include *.exe, *.dll) {
            $deps = & $dumpbin.FullName /nologo /dependents $bin.FullName |
              Select-String '^\s+(\S+\.dll)\s*$' | ForEach-Object { $_.Matches[0].Groups[1].Value }
            foreach ($dep in $deps) {
              if ($dep -match '^(msvcp|vcruntime|concrt|vccorlib)' -and -not (Test-Path (Join-Path $release $dep))) {
                $missing += "$($bin.Name) -> $dep"
              }
            }
          }
          if ($missing) { throw "Visual C++ runtime DLLs missing from the zip: $($missing -join ', ')" }
          Get-ChildItem $release -Filter *.dll | Format-Table Name, Length
      - name: Zip the app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/money-converter-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist
          retention-days: 7

  linux:
    name: Linux tar.gz and snap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: bash tool/bootstrap_platforms.sh
      - run: flutter build linux --release
      - name: Snap version
        run: |
          base=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          sed -i "s/^version: .*/version: '${base}+${{ github.run_number }}'/" snap/snapcraft.yaml
      - uses: snapcore/action-build@v1
        id: snap
      - name: Collect the files
        run: |
          mkdir -p dist
          tar -czf dist/money-converter-linux-x64.tar.gz -C build/linux/x64/release/bundle .
          cp "${{ steps.snap.outputs.snap }}" dist/money-converter-linux-amd64.snap
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist
          retention-days: 7

  release:
    name: GitHub release
    needs: [android, windows, linux]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          tag="v${version}-${RUN}"
          title=$(git log -1 --format=%s "$GITHUB_SHA")
          {
            echo "**${title}**"
            echo ""
            echo "## What's new"
            echo ""
            cat fastlane/metadata/android/en-US/changelogs/default.txt
            echo ""
            echo "## Nouveautés"
            echo ""
            cat fastlane/metadata/android/fr-FR/changelogs/default.txt
            echo ""
            echo "## Downloads"
            echo ""
            echo "| File | Platform | How to install |"
            echo "| --- | --- | --- |"
            echo "| \`money-converter-android.apk\` | Android 5.0+ | Open the file on the phone (allow installs from this source). Signed with the developer's own key: uninstall a Google Play version first. |"
            echo "| \`money-converter-windows-x64.zip\` | Windows 10/11 (x64) | Unzip and run \`moneyconverter.exe\`. Not signed: Windows SmartScreen may ask for confirmation. |"
            echo "| \`money-converter-linux-x64.tar.gz\` | Linux (x64, GTK 3) | Extract and run \`./moneyconverter\`. |"
            echo "| \`money-converter-linux-amd64.snap\` | Linux (snapd) | \`sudo snap install --dangerous money-converter-linux-amd64.snap\` |"
            echo ""
            echo "Web version: https://juadde.github.io/money_converter/"
          } > notes.md
          gh release create "$tag" dist/* \
            --title "Money Converter ${version} (build ${RUN})" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest
          echo "Release $tag created" >> "$GITHUB_STEP_SUMMARY"
