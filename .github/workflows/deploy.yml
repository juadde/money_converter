name: Deploy

# - every push on main: web app to GitHub Pages (Android APK release and
#   iOS build check are disabled for now);
# - every working day after the ECB publication (around 16:00 CET): the web
#   app is redeployed with a fresh rates.json, the fallback data source.
on:
  push:
    branches: [main]
  schedule:
    - cron: '25 15 * * 1-5'
    - cron: '25 17 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web and rates.json to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: bash tool/bootstrap_platforms.sh
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - name: Add the privacy policy
        run: cp site/privacy.html build/web/privacy.html
      - name: Add the ECB rates as JSON
        run: python3 tool/ecb_to_json.py --output build/web/rates.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v5

  android:
    name: Android APK to the "latest" release
    # Disabled for now: only the web app is deployed. To re-enable, use:
    #   if: github.event_name != 'schedule'
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: bash tool/bootstrap_platforms.sh
      - run: flutter build apk --release
      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk moneyconverter.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest moneyconverter.apk \
            --title "Dernier build Android" \
            --notes "Build automatique du commit ${GITHUB_SHA}." \
            --prerelease \
            --target "${GITHUB_SHA}"

  ios:
    name: iOS build (no code signing)
    # Disabled for now: only the web app is deployed. To re-enable, use:
    #   if: github.event_name != 'schedule'
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: bash tool/bootstrap_platforms.sh
      - run: flutter build ios --release --no-codesign
