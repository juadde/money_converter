name: Deploy

# - every push on main: web app to GitHub Pages (iOS build check disabled
#   for now; Android, Windows and Linux builds go to the Release workflow);
# - every working day after the ECB publication (around 16:00 CET): the web
#   app is redeployed with a fresh rates.json, the fallback data source.
on:
  push:
    branches: [main]
  schedule:
    - cron: '25 15 * * 1-5'
    - cron: '25 17 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Build the web app and rates.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: bash tool/bootstrap_platforms.sh
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - name: Add the privacy policy
        run: cp site/privacy.html build/web/privacy.html
      - name: Add the ECB rates as JSON
        run: python3 tool/ecb_to_json.py --output build/web/rates.json
      # Published with the site: https://juadde.github.io/money_converter/sbom.spdx.json
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: build/web/sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  # Deployed from a job of its own, as actions/deploy-pages recommends: in
  # the same job it sometimes could not find the artifact just uploaded.
  pages:
    name: Publish to GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  ios:
    name: iOS build (no code signing)
    # Disabled for now: only the web app is deployed. To re-enable, use:
    #   if: github.event_name != 'schedule'
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: bash tool/bootstrap_platforms.sh
      - run: flutter build ios --release --no-codesign
