name: moneyconverter
description: Currency converter based on the ECB euro foreign exchange reference rates.
publish_to: none
version: 2.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  country_flags: ^4.1.2
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  intl: any
  shared_preferences: ^2.3.2
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  msix: ^3.16.0

flutter:
  uses-material-design: true

# App icon (green banknote). Sources: assets/icon/*.svg. The icons are written
# into the generated platform folders by tool/bootstrap_platforms.sh.
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#EAF6EE"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#EAF6EE"
    theme_color: "#1E8E4E"
  windows:
    generate: true
    image_path: assets/icon/icon.png
    icon_size: 256

# Windows package (MSIX) for the Microsoft Store. The Store identity
# (identity name, publisher, publisher display name) is passed by the
# "Desktop" workflow from the repository variables, see the README.
msix_config:
  # Must match the name reserved in Partner Center.
  display_name: Money Converter (ECB)
  publisher_display_name: juadde
  identity_name: com.juadde.moneyconverter
  # Placeholder: the Store publisher comes from the MSSTORE_PUBLISHER variable.
  publisher: CN=00000000-0000-0000-0000-000000000000
  logo_path: assets/icon/icon.png
  capabilities: internetClient
  languages: en-us, fr-fr, de-de, es-es, it-it, pl-pl, ro-ro, lt-lt
